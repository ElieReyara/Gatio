# Services locaux de développement. Mémoire limitée : poste à 8 Go (CLAUDE.md §9).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gatio
      POSTGRES_PASSWORD: gatio
      POSTGRES_DB: gatio
    command: ['postgres', '-c', 'shared_buffers=64MB', '-c', 'max_connections=40']
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 384m
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gatio -d gatio']
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.31.4
    ports:
      - '127.0.0.1:8025:8025'
      - '127.0.0.1:1025:1025'
    mem_limit: 64m

volumes:
  pgdata:
